[internal.compiler_error]
message = "{message}"

[driver.load_failed]
message = "failed to load {path}: {error}"

[driver.output_failed]
message = "{message}"

[syntax.expected_identifier]
message = "expected identifier"
primary = "expected identifier here"

[syntax.expected_number]
message = "expected number literal"
primary = "expected number here"

[syntax.expected_punct]
message = "expected `{punct}`"
primary = "expected `{punct}` here"

[syntax.expected_group]
message = "expected {delimiter} group"
primary = "expected {delimiter} group here"

[syntax.unexpected_trailing_tokens]
message = "unexpected tokens after expression"
primary = "this token was not parsed"

[syntax.unsupported_macro_call]
message = "macro call syntax is not supported yet"
primary = "this `!` starts a macro call"

[syntax.unsupported_method_call]
message = "method call syntax is not supported yet"
primary = "this argument list belongs to a method call"

[syntax.unsupported_function_type]
message = "function type syntax is not supported yet"
primary = "this parameter list belongs to a function type"

[syntax.unsupported_postfix_call]
message = "postfix call syntax is not supported yet"
primary = "this argument list was not attached to the expression"

[syntax.unterminated_block_comment]
message = "unterminated block comment"
primary = "this block comment is never closed"

[syntax.unexpected_character]
message = "unexpected character"
primary = "this character is not valid Lain syntax"

[syntax.unsupported_string_escape]
message = "unsupported string escape"
primary = "this escape sequence is not supported"

[syntax.unterminated_string]
message = "unterminated string literal"
primary = "this string literal is never closed"

[syntax.unexpected_closing_delimiter]
message = "unexpected closing delimiter"
primary = "this delimiter has no matching opener"

[syntax.unclosed_delimiter]
message = "unclosed delimiter"
primary = "expected closing `{delimiter}` for this delimiter"

[syntax.top_level_form_head]
message = "top-level form must start with an identifier"
primary = "this form cannot be dispatched to meta"

[syntax.no_form_parser]
message = "no meta form parser registered for this form head"
primary = "register a parser with register-form-parser!"

[decl.duplicate_import]
message = "duplicate import `{module}`"
note = "import declarations currently collide on their root module"

[decl.duplicate_declaration]
message = "duplicate {kind} declaration `{name}`"

[core.missing_function]
message = "function `{name}` is used but has no core declaration"

[core.missing_derived_function]
message = "function `{name}` is used but was not generated; derive({derive}) expansion is not wired into core lowering yet"
