name: Lain CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Ensure clang and ninja are installed
        run: |
          if ! command -v clang >/dev/null 2>&1 || ! command -v ninja >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang ninja-build
          fi
          clang --version

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.3'

      - name: Run full verification suite (Stage-1 -> Stage-2 -> Stage-3 fixed point)
        run: python3 scripts/verify_all.py

      - name: Smoke test standalone lainc C99 pipeline
        run: |
          mkdir -p build/ci-smoke
          clang -std=c99 -O2 seed/bootstrap/lainc_boot.c -o build/ci-smoke/lainc
          ./build/ci-smoke/lainc examples/overhaul_showcase.lain --out build/ci-smoke/showcase.c
          clang -std=c99 -O2 build/ci-smoke/showcase.c -o build/ci-smoke/showcase
          set +e
          ./build/ci-smoke/showcase
          rc=$?
          set -e
          echo "showcase exit code: $rc"
          test "$rc" -eq 126
