name: Lain bootstrap

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build seed tools
        working-directory: seed
        run: zig build

      - name: Verify checked-in snapshot
        run: python scripts/check_lainc_bootstrap_snapshot.py bootstrap/lainc.l1

      - name: Build native lainc from snapshot
        run: >-
          python scripts/build_default_lainc.py
          --output build/lainc-ci
          --c-output build/lainc-ci.c

      - name: Run native compiler matrix
        run: python scripts/check_native_lainc_matrix.py build/lainc-ci

      - name: Verify bootstrap release package and install
        run: python scripts/check_lainc_bootstrap_release.py

      - name: Run compiler API baseline
        run: python scripts/check_lainc_lainir_api_baseline.py
