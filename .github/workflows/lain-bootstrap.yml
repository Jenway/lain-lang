name: Lain core

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.3'

      - name: Configure
        run: cmake -S seed -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Run regression suite
        run: bash scripts/regress.sh

      - name: Run round-trip suite
        run: bash scripts/regress.sh --round-trip

      - name: Build Meta unit
        run: python3 scripts/build_meta_unit.py

      - name: Meta pipeline smoke test
        run: |
          ./build/lain-meta --unit build/lain0/bootstrap_unit.txt \
            arith.lain bootstrap/lain/examples/arith.lain | tee build/meta-arith.log
          grep -q 'host_status=0' build/meta-arith.log
          grep -q 'output bytes=74' build/meta-arith.log

