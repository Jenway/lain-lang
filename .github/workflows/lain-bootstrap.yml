name: Lain core

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up CMake
        uses: jwlawson/actions-setup-cmake@v2
        with:
          cmake-version: '4.0.3'

      - name: Configure
        run: cmake -S seed -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Compile and round-trip every example
        run: |
          fail=0
          for f in examples/*.lain; do
            ./build/lain0/lain0 "$f" || { echo "FAIL $f"; fail=1; }
            ./build/lain0/lain0 --round-trip "$f" || { echo "FAIL round-trip $f"; fail=1; }
          done
          exit $fail

      - name: Split Meta into per-module units
        run: ./build/lain0/lain0 --entry src/meta.lain --split build/units

      - name: Meta lowers arith
        run: |
          ./build/lain-meta --root "$PWD" --units-dir "$PWD/build/units" \
            --lower 0 --out build/arith.out "$PWD/examples/arith.lain" | tee build/meta-arith.log
          grep -q 'host_status=0' build/meta-arith.log
          grep -q 'output bytes=74' build/meta-arith.log
