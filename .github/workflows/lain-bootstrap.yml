name: Lain core

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build seed tools
        run: python scripts/build_seed.py

      - name: Check LAINIR and LAINVM boundary
        run: python scripts/check_lainvm_boundary.py

      - name: Check eval TCB behavior
        run: python scripts/check_eval_tcb.py

      - name: Check LAINIR physical safety
        run: python scripts/check_lainir_physical_safety.py

      - name: Run VM control test
        run: ./build/seed/bin/lainir-vm-control-test

      - name: Self-host the LAINIR compiler
        run: python scripts/run_lainir_self_host.py
