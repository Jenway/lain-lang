name: Lain CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Ensure clang is installed
        run: |
          if ! command -v clang >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y clang
          fi
          clang --version

      - name: Bootstrap standalone lainc and run pure-Lain build.lain (fixed point + test.lain + showcase)
        run: |
          mkdir -p build
          gcc -std=c99 -O2 bootstrap/lainc_boot.c -o build/lainc
          ./build/lainc build.lain --entry main --out build/build_runner.c
          gcc -std=c99 -O2 build/build_runner.c -o build/build_runner
          ./build/build_runner --bootstrap
