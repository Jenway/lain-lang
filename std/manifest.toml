# Lain standard-library source inventory after the pure-Lain cutover.

std_version = "0.1.0"
language_edition = "2026"

sources = [
    "control.lain",
    "intrusive.lain",
    "mem.lain",
    "slice.lain",
    "three_param.lain",
]

# Allocation, strings, collections, files, processes, environment access and
# sockets must be rebuilt on a Lain-owned runtime model.  The deleted libc and
# C-host wrappers must not be restored as the compiler's implementation.
